<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64x64.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Conoce CouchOne Fit: el espacio en desarrollo para entrenadores y nutriólogos que conecta expedientes, entrenamiento, nutrición y seguimiento con la app de sus clientes."
    />
    <meta name="theme-color" content="#4037f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CouchOne Fit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Aplica el tema antes de pintar. Debe coincidir con src/shared/theme.ts.
      (function () {
        var inWorkspace = /^\/(app|admin)(\/|$)/.test(location.pathname);
        var theme = 'light';
        if (inWorkspace) {
          var saved = null;
          try {
            saved = localStorage.getItem('couchonefit-theme');
          } catch (e) {}
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>CouchOne Fit | Tus planes. Su progreso.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
