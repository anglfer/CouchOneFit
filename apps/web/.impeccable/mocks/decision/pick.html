<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:900px;background:#fff;font-family:'Segoe UI',sans-serif;color:#1a1a1a;overflow:hidden}
.head{display:flex;justify-content:space-between;padding:28px 64px;border-bottom:3px solid #1a1a1a;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:40px 64px}
h1{font-size:72px;font-weight:700;margin:0 0 20px;letter-spacing:-.02em}
.row{display:grid;grid-template-columns:200px 1fr 80px;gap:16px;align-items:center;border-top:1px solid #bbb;padding:14px 0;font-size:16px}
.bar{height:16px;background:linear-gradient(90deg,#ddd 0 35%,#cfe3d4 35% 65%,#ddd 65%)}.bar b{display:block;height:100%;width:58%;background:#1a1a1a}
.cta{display:inline-block;background:#c8102e;color:#fff;padding:16px 26px;font-weight:700;margin-top:24px}
.fig{border:1px solid #1a1a1a;height:600px;background:#eaeffd}
</style></head><body><div class="head"><b>CouchOne Fit · Reporte de producto</b><span>Producto · Planes · Iniciar sesión</span></div>
<div class="grid"><div><h1>Tus planes. Su progreso.</h1>
<div class="row"><span>Evaluación</span><div class="bar"><b></b></div><span>Expediente</span></div>
<div class="row"><span>Alimentación</span><div class="bar"><b style="width:70%"></b></div><span>Planes</span></div>
<div class="row"><span>Entrenamiento</span><div class="bar"><b style="width:45%"></b></div><span>Rutinas</span></div>
<div class="row"><span>Seguimiento</span><div class="bar"><b style="width:80%"></b></div><span>Check-ins</span></div>
<a class="cta">Crear mi cuenta</a></div><div class="fig"></div></div></body></html>
