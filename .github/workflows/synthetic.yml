name: Synthetic availability

# SLA v3.0: sondeo externo cada 30 minutos. El monitor aplica la configuración
# administrativa (30 min por defecto) con --respect-schedule y omite el turno
# hasta que pasen 30 minutos desde el último.
# GitHub descarta casi todas las ejecuciones programadas de este repositorio
# (2 de ~160 el 25/26-nov), por eso el disparador de 5 minutos queda solo de
# respaldo y el disparo real lo hace un cron externo (p. ej. cron-job.org) en
# los minutos 2 y 32 de cada hora (calidad-observabilidad.md §18.4):
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/synthetic.yml/dispatches
#   Authorization: Bearer <token>  (fine-grained, solo este repo, Actions: read and write)
#   {"ref":"main","inputs":{"respect_schedule":"true"}}
# repository_dispatch (event_type synthetic-probe) sigue disponible, pero exige
# Contents: write, un permiso que también permite modificar el código.
# SYNTHETIC_MONITOR_ENABLED se activa tras revisar el cupo de Render Free.
on:
  schedule:
    - cron: '2-57/5 * * * *'
  repository_dispatch:
    types: [synthetic-probe]
  workflow_dispatch:
    inputs:
      respect_schedule:
        description: 'Respetar el intervalo de 30 min (disparo del cron externo)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: synthetic
  cancel-in-progress: false

jobs:
  probe:
    name: Sondeo sintético y monitoreo funcional
    if: >-
      ${{ github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'workflow_dispatch' || vars.SYNTHETIC_MONITOR_ENABLED == 'true') &&
          (vars.SYNTHETIC_API_URL != '' || vars.SYNTHETIC_WEB_URL != '' || vars.SYNTHETIC_TARGETS != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNTHETIC_TARGETS: ${{ vars.SYNTHETIC_TARGETS }}
      SYNTHETIC_API_URL: ${{ vars.SYNTHETIC_API_URL }}
      SYNTHETIC_WEB_URL: ${{ vars.SYNTHETIC_WEB_URL }}
      SYNTHETIC_ORIGIN: ${{ vars.SYNTHETIC_ORIGIN }}
      SYNTHETIC_CLIENT_ID: ${{ secrets.SYNTHETIC_CLIENT_ID || vars.SYNTHETIC_CLIENT_ID }}
      OBSERVABILITY_INGEST_URL: ${{ vars.OBSERVABILITY_INGEST_URL }}
      OBSERVABILITY_INGEST_TOKEN: ${{ secrets.OBSERVABILITY_INGEST_TOKEN }}
      SYNTHETIC_PRO_IDENTIFIER: ${{ secrets.SYNTHETIC_PRO_IDENTIFIER }}
      SYNTHETIC_PRO_PASSWORD: ${{ secrets.SYNTHETIC_PRO_PASSWORD }}
      SYNTHETIC_CLIENT_IDENTIFIER: ${{ secrets.SYNTHETIC_CLIENT_IDENTIFIER }}
      SYNTHETIC_CLIENT_PASSWORD: ${{ secrets.SYNTHETIC_CLIENT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/quality

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restaurar historial
        uses: actions/cache/restore@v4
        with:
          path: logs/synthetic
          key: synthetic-monitor-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: synthetic-monitor-v2-

      - name: Sondear destinos
        id: probe
        env:
          RESPECT_SCHEDULE: ${{ inputs.respect_schedule }}
        run: |
          code=0
          if [ -n "$SYNTHETIC_API_URL" ] || [ -n "$SYNTHETIC_WEB_URL" ]; then
            args=(--env production --out logs/synthetic --timeout 65000 --trigger-source github_actions)
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$RESPECT_SCHEDULE" = "true" ]; then args+=(--respect-schedule); else args+=(--force); fi
            node scripts/quality/external-monitor.mjs "${args[@]}" || code=$?
          elif [ -n "$SYNTHETIC_TARGETS" ]; then
            targs=()
            for target in $SYNTHETIC_TARGETS; do
              targs+=(--target "$target")
            done
            node scripts/quality/synthetic-check.mjs "${targs[@]}" \
              --timeout 65000 --out logs/synthetic || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Depurar historial de más de 35 días
        # Por la fecha del nombre: la caché restaurada no conserva mtime.
        run: |
          mkdir -p logs/synthetic
          cutoff="$(date -u -d '35 days ago' +%Y-%m-%d)"
          for file in logs/synthetic/{synthetic,monitor}-*.jsonl; do
            [ -e "$file" ] || continue
            day="$(basename "$file" .jsonl)"
            if [[ "${day#*-}" < "$cutoff" ]]; then rm -f -- "$file"; fi
          done

      - name: Informe SLI
        run: |
          node scripts/quality/sli-report.mjs \
            --synthetic logs/synthetic --logs logs/none \
            --out test-results/sli/synthetic
          cat test-results/sli/synthetic/sli-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar historial
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/synthetic
          key: synthetic-monitor-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publicar evidencia
        if: always() && (github.event_name == 'workflow_dispatch' || steps.probe.outputs.exit_code != '0')
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/synthetic/pending-ingest.jsonl
            logs/synthetic/rejected-ingest.jsonl
            logs/synthetic/latest-run.json
            test-results/sli/synthetic/
          retention-days: 30
          if-no-files-found: warn

      - name: Fallar si el sondeo falló
        if: always() && steps.probe.outputs.exit_code != '0'
        run: |
          echo "El sondeo detectó comprobaciones fallidas o resultados pendientes de ingesta."
          exit 1
