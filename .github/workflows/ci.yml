name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'docs/database/**'
      - 'scripts/quality/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/**'
      - 'docs/database/**'
      - 'scripts/quality/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas, carga y recuperación
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: CouchOneFit_test
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales desechables del servicio PostgreSQL de este job (solo CI).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/CouchOneFit_test
      QUALITY_LOAD_DURATION_S: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Instalar dependencias de la API
        run: npm --prefix apps/api ci

      - name: Instalar dependencias de la Web
        run: npm --prefix apps/web ci

      - name: Migrar la base de pruebas
        run: npm --prefix apps/api run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Compilar la API
        run: npm --prefix apps/api run build

      - name: Compilar la Web
        run: npm --prefix apps/web run build

      - name: Lint de la Web
        run: npm --prefix apps/web run lint

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Configuración móvil de CI
        run: cp apps/mobile/.env.example apps/mobile/.env.json

      - name: Dependencias móviles
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Análisis estático móvil
        working-directory: apps/mobile
        run: flutter analyze

      - name: Pruebas automatizadas (quality, api, web, mobile, load)
        id: tests
        run: node scripts/quality/test-all.mjs

      - name: Resumen de la corrida
        if: always()
        run: |
          latest="$(ls -1d test-results/runs/*/ 2>/dev/null | sort | tail -n 1)"
          if [ -n "$latest" ] && [ -f "${latest}summary.md" ]; then
            cat "${latest}summary.md" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${latest}sli-report.md" ]; then
              cat "${latest}sli-report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No se generó resumen de pruebas." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
